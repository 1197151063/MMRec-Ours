# Frozen content + regularized item ID residual. Set item_id_weight to [0.0] for content-only.
embedding_size: 64
alpha: [0.5]
item_id_weight: [0.1]
temperature: [0.1]
num_negatives: [128]
reg_weight: [0.0001]
learning_rate: 0.001
use_neg_sampling: False
# Training-set reconstruction Recall is not a directly comparable generalization gap.
evaluate_train: False
hyper_parameters: [alpha, item_id_weight, temperature, num_negatives, reg_weight]
